<title>Why Does an Octopus Need Three Hearts?</title>
<style>
  html, body { margin: 0; height: 100%; background: #1b1714; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { max-width: 100vw; max-height: 100vh; width: auto; height: auto; display: block; cursor: pointer; }

<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
"use strict";
// =====================================================================
//  WHY DOES AN OCTOPUS NEED THREE HEARTS? — 16:9, 81.0s, 24fps, cut paper, voice-led.
//  Bloo, a drop of blue (copper) blood, is carried through the octopus by its three hearts.
//  The voice-over is recorded separately (voice/script.md); TIMELINE.narration holds each line's planned window,
//  the score ducks under those windows and leaves them clear for the voice.
//  Build: node <skill>/tools/build.mjs pieces/octopus-hearts. Preview: open index.html (?t=12.5 freezes a frame).
// =====================================================================
const FORMATS = { '16:9': [1920, 1080] };
const FORMAT = '16:9';
const FPS = 24, [W, H] = FORMATS[FORMAT];
const BPM = 120, GRID0 = 0, BEAT = 60 / BPM, E8 = BEAT / 2, E16 = BEAT / 4;
const DURATION = 81.0;
const NFRAMES = Math.round(DURATION * FPS);
const LOOP_T = NFRAMES / FPS;
const SAFE = { top: 60, bottom: 110, right: 60 };
const HAND = '"Ink Free", "Segoe Print", "Bradley Hand", "Chalkboard SE", "Comic Sans MS", "Comic Neue", cursive';
const CX = (W - SAFE.right) / 2;
const onBeat = (t) => +(GRID0 + Math.round((t - GRID0) / E8) * E8).toFixed(4);

// the narration: one line per beat, with its planned window (the voice is recorded to fit these)
const NARR = [
  ['open',    1.5,  3.6,  'This octopus has three hearts.'],
  ['why',     7.8,  11.6, 'You have one. So why does an octopus need three?'],
  ['blue',    14.3, 16.2, 'Because its blood is blue.'],
  ['copper',  16.7, 21.5, 'Instead of iron, it carries oxygen with copper, in a protein called hemocyanin.'],
  ['less',    24.8, 27.3, 'Copper blood holds less oxygen than ours,'],
  ['thick',   27.6, 30.8, "and it's thicker, so it's harder to push around."],
  ['gills',   34.8, 39.2, 'And every drop has to squeeze through the gills to pick up oxygen.'],
  ['two',     41.3, 46.8, 'So the octopus has two extra hearts, one beside each gill, to pump blood through them.'],
  ['third',   49.8, 54.8, 'Then the third heart, the big one, sends that fresh blood around the whole body,'],
  ['arms',    55.1, 57.9, 'to eight arms, and a very big brain.'],
  ['swim',    60.8, 64.3, 'But when an octopus swims, that body heart briefly stops.'],
  ['crawl',   66.8, 69.2, "That's why octopuses would rather crawl."],
  ['end',     72.8, 77.0, 'Three hearts. Two for the gills. One for everything else.'],
];

// worlds: eras joined by shape morphs at M[i]; one hard cut (the payoff) at HIT
const M = [7.0, 13.5, 24.0, 34.0, 40.5, 49.0, 60.0, 72.0];
const HIT = 66.0;
const ERA_LIST = [
  [0,    M[0], () => sceneOpen()],
  [M[0], M[1], () => sceneCompare()],
  [M[1], M[2], () => sceneBlue()],
  [M[2], M[3], () => sceneRace()],
  [M[3], M[4], () => sceneGills()],
  [M[4], M[5], () => sceneGillHearts()],
  [M[5], M[6], () => sceneBodyHeart()],
  [M[6], HIT,  () => sceneSwim()],
  [HIT,  M[7], () => sceneCrawl()],
  [M[7], DURATION, () => sceneEnd()],
];
const SHOTS = [
  ['open',     0, 0,    M[0],     'the octopus on the seabed; three hearts pop'],
  ['compare',  1, M[0], M[1],     'you: one heart. the octopus: three. why?'],
  ['blue',     2, M[1], M[2],     'inside a vein: Bloo, a drop of blue copper blood'],
  ['race',     3, M[2], M[3],     'a red cell races past with lots of oxygen; Bloo wades through thick blood'],
  ['gills',    4, M[3], M[4],     'Bloo stuck squeezing through the gills'],
  ['gillhrt',  5, M[4], M[5],     'two gill hearts pump Bloo through; it fills with oxygen'],
  ['bodyhrt',  6, M[5], M[6],     'the big body heart sends Bloo to eight arms and a big brain'],
  ['swim',     7, M[6], HIT,      'an eel! the octopus jets away; the body heart stops'],
  ['crawl',    8, HIT,  M[7],     'thud: it lands and crawls off'],
  ['end',      9, M[7], DURATION, 'three hearts beating together; Bloo waves'],
];
const TIMELINE = {
  width: W, height: H, fps: FPS, bpm: BPM, gridOffset: GRID0, duration: DURATION, frames: NFRAMES, loop: LOOP_T, safe: SAFE, aspect: FORMAT,
  format: 'morph-chain',
  shots: SHOTS.map(([key, era, t0, t1, title], i) => ({ id: i + 1, key, era, t0, t1, title })),
  cuts: [HIT],
  morphs: M,
  cues: {
    pop1: 2.75, pop2: 3.0, pop3: 3.25,
    human: 8.0, humanHeart: 8.5, octo: 9.5, octoHearts: 9.75, ask: 10.75,
    bloo: 15.5, pack: 19.0, hemo: 20.5,
    cell: 25.0, count: 26.0, goo: 28.0, sweat: 29.5, pant: 31.5,
    squeeze: 36.5, stuck: 37.5,
    pumpA: 42.0, shove: 44.5, fill: 45.0,
    bigPump: 50.0, ride: 51.0, arms: 55.25, brain: 57.25,
    eel: 60.5, jet: 61.5, stop: 63.5, silence: 64.25,
    hit: HIT,
    sync: 73.0, wave: 75.0, title: 77.0,
  },
  acts: [
    { name: '1 Hook',        role: 'build',   t0: 0.0,   t1: M[1] },
    { name: '2 Blue blood',  role: 'build',   t0: M[1],  t1: M[3] },
    { name: '3 The hearts',  role: 'journey', t0: M[3],  t1: M[6] },
    { name: '4 The swim',    role: 'peak',    t0: M[6],  t1: 64.25 },
    { name: '5 Stopped',     role: 'silence', t0: 64.25, t1: HIT },
    { name: '6 Crawl',       role: 'gift',    t0: HIT,   t1: M[7] },
    { name: '7 Three hearts', role: 'goodbye', t0: M[7], t1: DURATION },
  ],
  board: [
    { t: 4.5,  title: 'three hearts', sound: 'ba-dum x3', next: 'the middle heart morphs' },
    { t: 11.0, title: 'one vs three', sound: 'a question pluck', next: 'the ? bubble becomes Bloo' },
    { t: 20.8, title: 'blue blood: copper', sound: 'a coin clink', next: 'Bloo to Bloo' },
    { t: 30.0, title: 'the race', sound: 'a whoosh; a slow squelch', next: 'Bloo to Bloo' },
    { t: 38.0, title: 'stuck in the gills', sound: 'a squeak', next: 'the gill becomes a heart' },
    { t: 46.0, title: 'two gill hearts', sound: 'pumps on the beat', next: 'gill heart to body heart' },
    { t: 57.6, title: 'the body heart', sound: 'a big pump; the groove', next: 'the mantle' },
    { t: 63.9, title: 'the swim', sound: 'jet whoosh; the heart stops', next: 'hard cut on the hit' },
    { t: 68.5, title: 'crawl', sound: 'the loudest hit; a flat chord', next: 'back to the start' },
    { t: 79.0, title: 'three hearts', sound: 'the opening ba-dum, together', next: 'end' },
  ],
  narration: NARR.map(([id, t0, t1, text]) => ({ id, t0, t1, text })),
};
window.TIMELINE = TIMELINE;
