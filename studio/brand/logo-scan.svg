<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <!-- A: the scan window: a cutaway "x-ray" lens with a glowing hook (a hidden J) and the warm signal spark -->
  <defs>
    <radialGradient id="bg" cx="38%" cy="32%" r="80%"><stop offset="0" stop-color="#5e4a74"/><stop offset="1" stop-color="#2f2440"/></radialGradient>
    <radialGradient id="win" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#1d5f6b"/><stop offset="0.7" stop-color="#123f4b"/><stop offset="1" stop-color="#123f4b" stop-opacity="0"/></radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <circle cx="400" cy="400" r="400" fill="url(#bg)"/>
  <circle cx="400" cy="410" r="300" fill="url(#win)"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 468 238 L 468 468 Q 468 572 372 572 Q 288 572 278 494" stroke="#6fe0ec" stroke-width="64" opacity="0.45" filter="url(#glow)"/>
    <path d="M 468 238 L 468 468 Q 468 572 372 572 Q 288 572 278 494" stroke="#7fe3ee" stroke-width="40"/>
    <path d="M 468 238 L 468 468 Q 468 572 372 572 Q 288 572 278 494" stroke="#e8ffff" stroke-width="13"/>
  </g>
  <circle cx="468" cy="238" r="52" fill="#ffb347" opacity="0.55" filter="url(#glow)"/>
  <circle cx="468" cy="238" r="27" fill="#ffc861"/>
  <circle cx="460" cy="230" r="10" fill="#fff4d0"/>
  <path d="M 150 300 A 270 270 0 0 1 300 150" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="18" stroke-linecap="round"/>
</svg>
