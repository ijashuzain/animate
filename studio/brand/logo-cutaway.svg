<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <!-- B: the cutaway: a sphere with a quarter cut open to show glowing layers inside (every film opens something up) -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%"><stop offset="0" stop-color="#16424d"/><stop offset="1" stop-color="#0c2a33"/></radialGradient>
    <radialGradient id="ball" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#6e5788"/><stop offset="1" stop-color="#3b2d4c"/></radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
    <clipPath id="wedge"><path d="M 400 400 L 400 140 A 260 260 0 0 1 660 400 Z"/></clipPath>
  </defs>
  <circle cx="400" cy="400" r="400" fill="url(#bg)"/>
  <path d="M 400 400 L 660 400 A 260 260 0 1 1 400 140 Z" fill="url(#ball)"/>
  <path d="M 230 220 A 230 230 0 0 1 330 160" fill="none" stroke="#fff" stroke-opacity="0.22" stroke-width="16" stroke-linecap="round"/>
  <g clip-path="url(#wedge)">
    <circle cx="400" cy="400" r="258" fill="#2b5f6a"/>
    <circle cx="400" cy="400" r="200" fill="#3f8f9a"/>
    <circle cx="400" cy="400" r="200" fill="none" stroke="#7fe3ee" stroke-width="10" opacity="0.9"/>
    <circle cx="400" cy="400" r="135" fill="#6fd2dc"/>
    <circle cx="400" cy="400" r="135" fill="none" stroke="#e8ffff" stroke-width="8"/>
    <circle cx="400" cy="400" r="70" fill="#ffc861"/>
  </g>
  <circle cx="400" cy="400" r="95" fill="#ffb347" opacity="0.5" filter="url(#glow)"/>
  <circle cx="400" cy="400" r="40" fill="#fff4d0"/>
</svg>
